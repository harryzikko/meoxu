name: Build Meo Xu Mobile App (APK & Unsigned IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Prepare Android Platform Scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --org com.meoxu.app --project-name meoxu .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -f test/widget_test.dart
          # Inject Android permissions and app label
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="meoxu"/android:label="Meo Xu"/g' android/app/src/main/AndroidManifest.xml
          # Set SDK levels and debug signature fallback for sideload release build
          sed -i 's/flutter.compileSdkVersion/34/g; s/flutter.minSdkVersion/21/g; s/flutter.targetSdkVersion/34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Organize Artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MeoXu-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MeoXu-Android-APK
          path: dist/MeoXu-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Prepare iOS Platform Scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=ios --org com.meoxu.app --project-name meoxu .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          find Payload -name embedded.mobileprovision -delete
          find Payload -type f -exec sh -c 'file "$1" | grep -q "Mach-O" && codesign --remove-signature "$1" 2>/dev/null || true' sh {} \;
          zip -r MeoXu-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeoXu-iOS-IPA-Unsigned
          path: MeoXu-unsigned.ipa
          retention-days: 14
