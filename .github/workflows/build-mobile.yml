name: Build Meo Xu Mobile App (APK & Unsigned IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Prepare Android Platform Scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --org com.meoxu.app --project-name meoxu .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -f test/widget_test.dart
          cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.compileSdkVersion/34/g; s/flutter.minSdkVersion/21/g; s/flutter.targetSdkVersion/34/g' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (informational)
        run: flutter analyze --no-fatal-infos || true

      - name: Run unit tests
        run: flutter test

      - name: Build Android Release APK
        run: |
          if ! flutter build apk --release --no-tree-shake-icons -v > build.log 2>&1; then
            echo "::group::Build Log Tail"
            tail -n 60 build.log
            echo "::endgroup::"
            python3 -c "
import json
try:
    with open('build.log', 'r', encoding='utf-8', errors='replace') as f:
        lines = f.readlines()
    tail = ''.join(lines[-60:])
    with open('comment.json', 'w', encoding='utf-8') as out:
        json.dump({'body': '### ❌ Android Build Error Log:\n```\n' + tail + '\n```'}, out)
except Exception as e:
    pass
"
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d @comment.json \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" || true
            exit 1
          fi

      - name: Organize Artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MeoXu-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MeoXu-Android-APK
          path: dist/MeoXu-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Prepare iOS Platform Scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=ios --org com.meoxu.app --project-name meoxu .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -f test/widget_test.dart
          cp config/Info.plist ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (informational)
        run: flutter analyze --no-fatal-infos || true

      - name: Run unit tests
        run: flutter test

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          find Payload -name embedded.mobileprovision -delete
          find Payload -type f -exec sh -c 'file "$1" | grep -q "Mach-O" && codesign --remove-signature "$1" 2>/dev/null || true' sh {} \;
          zip -r MeoXu-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeoXu-iOS-IPA-Unsigned
          path: MeoXu-unsigned.ipa
          retention-days: 14
